<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-ar="فحص نظام التصميم" data-en="Design system check">فحص نظام التصميم</title>
<link rel="stylesheet" href="../ds.css"><script src="../_shared.js" defer></script></head>
<body>
<main class="dc-page" style="padding-block:var(--space-6);display:grid;gap:var(--space-5)">
<h1 style="font:var(--type-display-1);margin:0" data-ar="فحص ds.css" data-en="ds.css check">فحص ds.css</h1>
<div class="dc-hero"><svg class="dc-brush" data-autodraw viewBox="0 0 720 240" preserveAspectRatio="none" aria-hidden="true">
<path stroke-width="46" d="M-20 60 C 60 10, 110 120, 40 150 S 10 250, 120 215"/><path stroke-width="46" d="M740 30 C 650 70, 700 150, 640 190 S 700 250, 610 260"/></svg>
<img src="../assets/dardachat-lockup-knockout.png" width="620" height="340" data-ar-alt="دردشات" data-en-alt="Dardachat" alt="دردشات"></div>
<div class="dc-root">
  <button class="dc-btn dc-btn--cta" type="button" data-pop><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span>أضف إلى السلة</span><svg class="dc-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></button>
  <button class="dc-btn" type="button">شوف الصناديق</button>
  <a class="dc-btn dc-btn--outline" href="#" data-noop><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12z"/></svg><span>احجز عبر واتساب</span></a>
  <button class="dc-btn dc-btn--ghost" type="button">إلغاء</button>
  <button class="dc-btn dc-btn--cta dc-btn--sm" type="button" data-pop>أضف<svg class="dc-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></button>
  <button class="dc-btn" type="button" disabled>غير متوفر الآن</button>
</div>
<div class="dc-root dc-deal">
  <button class="dc-qcard" type="button" aria-pressed="false" aria-label="اقلب البطاقة"><span class="dc-qcard__inner">
    <span class="dc-qcard__face dc-qcard__front"><span class="dc-qcard__disc">سؤال</span></span>
    <span class="dc-qcard__face dc-qcard__back"><span class="dc-qcard__kicker">سؤال</span><span class="dc-qcard__q">شو أكثر لحظة حسّيت فيها إنك مفهوم تمامًا؟</span></span>
  </span></button>
  <button class="dc-qcard" type="button" aria-pressed="false" aria-label="اقلب البطاقة"><span class="dc-qcard__inner">
    <span class="dc-qcard__face dc-qcard__front dc-qcard__front--pink"><span class="dc-qcard__disc">تحدّي</span></span>
    <span class="dc-qcard__face dc-qcard__back"><span class="dc-qcard__kicker">تحدّي</span><span class="dc-qcard__q">ارسم الشخص اللي على يمينك بثلاثين ثانية، وخلّيه يخمّن مين.</span></span>
  </span></button>
  <button class="dc-qcard" type="button" aria-pressed="false" aria-label="اقلب البطاقة"><span class="dc-qcard__inner">
    <span class="dc-qcard__face dc-qcard__front"><span class="dc-qcard__disc">مين فينا؟</span></span>
    <span class="dc-qcard__face dc-qcard__back"><span class="dc-qcard__kicker">مين فينا؟</span><span class="dc-qcard__q">مين فينا أول واحد بيضحك بالجمعة؟</span></span>
  </span></button>
</div>
<div class="dc-root">
  <span class="dc-chip dc-chip--age">+12</span>
  <span class="dc-chip dc-chip--age">+18</span>
  <span class="dc-chip">للعائلة والأصدقاء</span>
  <span class="dc-chip dc-chip--pink">للأزواج</span>
  <span class="dc-chip dc-chip--season">موسمي · رمضان</span>
  <span class="dc-chip dc-chip--outline"><span class="dc-num">45</span> بطاقة</span>
</div>
</main></body></html>
