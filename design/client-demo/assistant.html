<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><link rel="icon" type="image/png" href="assets/favicon.png"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-ar="مساعد دردشات" data-en="Dardachat assistant">مساعد دردشات</title>
<link rel="stylesheet" href="ds.css">
<!-- The assistant is now a floating widget on every page (assistant-widget.js/.css, loaded by _shared.js).
     This page only forwards to home with the widget open. It carries ?lang / ?theme / ?motion / ?ask. -->
<script>
(function () {
  try {
    var q = new URLSearchParams(location.search), p = new URLSearchParams();
    ['lang', 'theme', 'motion', 'ask'].forEach(function (k) { if (q.get(k)) p.set(k, q.get(k)); });
    p.set('asst', 'open');
    location.replace('home.html?' + p.toString());
  } catch (e) {}
})();
</script>
<script src="_shared.js" defer></script>
</head>
<body>
<main id="main" class="dc-page" style="padding-block: var(--space-8)">
  <p><a href="home.html?asst=open" data-ar="افتح المساعد من الصفحة الرئيسية" data-en="Open the assistant from the home page">افتح المساعد من الصفحة الرئيسية</a></p>
</main>
</body>
</html>
