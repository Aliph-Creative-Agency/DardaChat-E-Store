<!-- @dsCard group="Commerce" height=520 -->
<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>ProductCard — preview</title></head>
<body>
<div class="dc-root">
  <article class="dc-product">
    <div class="dc-product__art"><svg viewBox="0 0 200 180" aria-hidden="true">
  <g class="dc-product__peek"><rect x="62" y="40" width="76" height="76" rx="10" fill="var(--surface)"/><circle cx="100" cy="76" r="20" fill="var(--red)"/></g>
  <rect x="30" y="78" width="140" height="92" rx="10" fill="var(--sky)"/>
  <rect x="30" y="78" width="140" height="92" rx="10" fill="none" stroke="var(--blue)" stroke-width="3"/>
  <circle cx="100" cy="124" r="22" fill="var(--red)"/><path d="M92 124c0-4 3-7 8-7s8 3 8 7-8 10-8 10-8-6-8-10z" fill="var(--on-red)"/>
  <g class="dc-product__lid"><rect x="24" y="62" width="152" height="24" rx="8" fill="var(--blue)"/></g>
</svg></div>
    <div class="dc-product__body">
      <div class="dc-row"><span class="dc-chip dc-chip--age">+12</span><span class="dc-chip">للعائلة والأصدقاء</span></div>
      <h3 class="dc-product__name">صندوق مين فينا</h3>
      <p class="dc-product__meta"><span class="dc-num">45</span> بطاقة في 3 مراحل · بروشور · <span class="dc-num">5</span> لافتات تصويت</p>
      <div class="dc-product__foot"><div class="dc-price"><span class="dc-price__now dc-num"><small>₪</small>129.00</span><span class="dc-price__vat">شامل الضريبة</span></div>
      <button class="dc-btn dc-btn--cta dc-btn--sm" type="button" data-pop>أضف<svg class="dc-heart" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.1 1.7-1.9 3.2-3.1 5.3-3.1 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg></button></div>
    </div>
  </article>
  <article class="dc-product">
    <div class="dc-product__art dc-product__art--sky"><svg viewBox="0 0 200 180" aria-hidden="true">
  <g class="dc-product__peek"><rect x="62" y="40" width="76" height="76" rx="10" fill="var(--surface)"/><circle cx="100" cy="76" r="20" fill="var(--red)"/></g>
  <rect x="30" y="78" width="140" height="92" rx="10" fill="var(--pink)"/>
  <rect x="30" y="78" width="140" height="92" rx="10" fill="none" stroke="var(--blue)" stroke-width="3"/>
  <circle cx="100" cy="124" r="22" fill="var(--red)"/><path d="M92 124c0-4 3-7 8-7s8 3 8 7-8 10-8 10-8-6-8-10z" fill="var(--on-red)"/>
  <g class="dc-product__lid"><rect x="24" y="62" width="152" height="24" rx="8" fill="var(--blue)"/></g>
</svg></div>
    <div class="dc-product__body">
      <div class="dc-row"><span class="dc-chip dc-chip--age">لكل الأعمار</span><span class="dc-chip dc-chip--season">موسمي · رمضان</span></div>
      <h3 class="dc-product__name">صندوق رمضان للعائلة</h3>
      <p class="dc-product__meta"><span class="dc-num">45</span> بطاقة: معلومات دينية، ألغاز، وذكريات رمضان</p>
      <p class="dc-product__note">يرجع مع بداية رمضان · غير متوفر الآن</p>
      <button class="dc-btn dc-btn--outline dc-btn--sm" type="button">نبّهني لما يرجع</button>
    </div>
  </article>
</div>
<script>
document.querySelectorAll('[data-pop]').forEach(b=>b.addEventListener('click',()=>{b.classList.remove('is-popped');void b.offsetWidth;b.classList.add('is-popped');}));
</script>
</body>
</html>
