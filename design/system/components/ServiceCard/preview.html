<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>ServiceCard — preview</title></head>
<body>
<div class="dc-root">
  <article class="dc-service">
    <h3 class="dc-service__title">ورشة سؤال وغرزة</h3>
    <p class="dc-service__desc">أسئلة عميقة من دردشات مع تطريز فلسطيني، جلسة حوارية دافئة تركّز على العمل اليدوي لتعزيز التواصل مع النفس.</p>
    <dl class="dc-service__facts">
      <div><dt>للفرد</dt><dd class="dc-num">₪130</dd></div>
      <div><dt>للمجموعة</dt><dd class="dc-num">₪1250–1700</dd></div>
      <div><dt>المدة</dt><dd>ساعتين ونص</dd></div>
    </dl>
    <a class="dc-btn dc-btn--cta" href="#" data-noop><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.1A8 8 0 1 1 20 12z"/></svg><span>احجز عبر واتساب</span></a>
  </article>
</div>
<script>
document.querySelectorAll('[data-noop]').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
</script>
</body>
</html>
