<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dardachat — cover</title>
<style>
  html, body { margin: 0; background: var(--cream); }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--cream); }
  .cover svg { position: absolute; inset: 0; width: 960px; height: 288px; }
  .blue { fill: var(--blue); } .pink { fill: var(--pink); } .sky { fill: var(--sky); } .red { fill: var(--red); } .brush { fill: var(--brush); }
  .card-lg { rx: var(--radius-lg); } .card-sm { rx: var(--radius-sm); }
  .name { position: absolute; left: 40px; bottom: 64px; margin: 0; max-width: 440px; font-family: var(--font-display); font-weight: 800;
    font-size: 80px; line-height: .95; color: var(--ink); }
  .tag { position: absolute; left: 42px; bottom: 36px; margin: 0; max-width: 440px; font: 500 14px/1.3 var(--font-sans); color: var(--ink-soft); }
</style></head>
<body>
<div class="cover">
  <svg viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: blue slab 224×288 (bleeds top/bottom/right) · pink card 176² radius-lg · sky card 160² radius-lg · red disc r=40 · cream ground.
      arrangement: two question cards fanned (−6°, +8°) from the name's side onto the blue slab, the way cards are dealt onto a table.
      pattern: literal motif (the square game card) — 15 small rounded cards in brush pink on the slab; chosen because the product IS a deck of rounded square cards.
      scales: space-4 (16px) gaps, 24px units, radius-sm on units, radius-lg on cards; everything right of x=480.
    -->
    <rect class="blue" x="736" y="0" width="224" height="288"/>
    <g>
      <rect class="brush card-sm" x="760" y="40" width="24" height="24"/><rect class="brush card-sm" x="800" y="40" width="24" height="24"/><rect class="brush card-sm" x="840" y="40" width="24" height="24"/><rect class="brush card-sm" x="880" y="40" width="24" height="24"/><rect class="brush card-sm" x="920" y="40" width="24" height="24"/>
      <rect class="brush card-sm" x="760" y="224" width="24" height="24"/><rect class="brush card-sm" x="800" y="224" width="24" height="24"/><rect class="brush card-sm" x="840" y="224" width="24" height="24"/><rect class="brush card-sm" x="880" y="224" width="24" height="24"/><rect class="brush card-sm" x="920" y="224" width="24" height="24"/>
      <rect class="brush card-sm" x="880" y="104" width="24" height="24"/><rect class="brush card-sm" x="920" y="104" width="24" height="24"/><rect class="brush card-sm" x="880" y="160" width="24" height="24"/><rect class="brush card-sm" x="920" y="160" width="24" height="24"/><rect class="brush card-sm" x="920" y="132" width="24" height="24"/>
    </g>
    <rect class="pink card-lg" x="536" y="56" width="176" height="176" transform="rotate(-6 624 144)"/>
    <rect class="sky card-lg" x="660" y="64" width="160" height="160" transform="rotate(8 740 144)"/>
    <circle class="red" cx="740" cy="144" r="40"/>
  </svg>
  <p class="name">Dardachat</p>
  <p class="tag">Conversation games in a box, from Jerusalem. «دردشات»</p>
</div>
</body>
</html>
